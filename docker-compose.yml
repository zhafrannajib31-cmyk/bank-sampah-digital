services:
  postgres:
    image: postgres:16-alpine
    container_name: bsd-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bank_sampah_digital
    ports:
      - "5432:5432"
    volumes:
      - bsd_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bank_sampah_digital"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  bsd_postgres_data:
